# 게시판·인증·자료 API Worker.
# 복원(2026-11-01): 배포본 Worker 이름·바인딩 기준. 운영 Worker 이름은 jsbeob-api-preview 이다.
# 사이트 Worker(jsbeob, 루트 wrangler.jsonc)가 service binding "API" 로 이 Worker를 호출하므로
# 9월 버전의 jsbeob.com/api/* routes 블록은 쓰지 않는다.
name = "jsbeob-api-preview"
main = "index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "jsbeob-db"
database_id = "2a52dfc6-5fbb-444e-9dbf-b8676833008c"

# 회원 업로드 사진·미디어용 R2.
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "jsbeob-uploads"

[observability]
enabled = true

# 운영값은 Cloudflare 대시보드(Workers → jsbeob-api-preview → 설정)에 있다. 여기에 값을 넣지 않는다.
#   일반 변수: SITE_ORIGIN, UPLOADS_PUBLIC_BASE, YOUTUBE_CHANNEL_ID, GOOGLE_CLIENT_ID
#   시크릿(`wrangler secret put`): AUTH_SECRET, YOUTUBE_API_KEY,
#     GOOGLE_CLIENT_SECRET, KAKAO_CLIENT_SECRET, KAKAO_REST_API_KEY
#     (2026-11 현재 뒤의 세 개는 일반 변수로 등록돼 있음 → 시크릿 전환 권장)
# 로컬 개발 값은 .dev.vars (.dev.vars.example 참고, git 제외).
