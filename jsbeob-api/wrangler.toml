# 게시판·인증·자료 API Worker.
# 복원(2026-11-01): 배포본 Worker 이름·바인딩 기준. 운영 Worker 이름은 jsbeob-api-preview 이다.
# 사이트 Worker(jsbeob, 루트 wrangler.jsonc)가 service binding "API" 로 이 Worker를 호출하므로
# 9월 버전의 jsbeob.com/api/* routes 블록은 쓰지 않는다.
name = "jsbeob-api-preview"
main = "index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]
# 운영 일반 변수는 대시보드에만 있다(아래 주석) — 배포가 그 변수들을 지우지 않도록 유지한다 (2026-11-09)
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "jsbeob-db"
database_id = "2a52dfc6-5fbb-444e-9dbf-b8676833008c"

# 회원 업로드 사진·미디어용 R2.
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "jsbeob-uploads"

# 스마트 배치 — 데이터베이스(D1, APAC) 가까운 곳에서 돌게 한다. 한국 접속이 LAX 로 붙어
# 질의마다 태평양을 건너던 지연을 줄이려고 (2026-11-21). 끄려면 이 블록을 지운다.
[placement]
mode = "smart"

[observability]
enabled = true

# 운영값은 Cloudflare 대시보드(Workers → jsbeob-api-preview → 설정)에 있다. 여기에 값을 넣지 않는다.
#   일반 변수: SITE_ORIGIN, UPLOADS_PUBLIC_BASE, YOUTUBE_CHANNEL_ID, GOOGLE_CLIENT_ID
#     (선택) ALLOWED_ORIGINS — 올림함 쿠키 요청에서 SITE_ORIGIN 말고도 받을 출처, 쉼표 구분. 운영에서는 비워 둔다
#   시크릿(`wrangler secret put`): AUTH_SECRET, YOUTUBE_API_KEY,
#     GOOGLE_CLIENT_SECRET, KAKAO_CLIENT_SECRET, KAKAO_REST_API_KEY
#     (2026-11 현재 뒤의 세 개는 일반 변수로 등록돼 있음 → 시크릿 전환 권장)
#     INTAKE_WORKER_TOKEN — 올림함 AI 감시 서비스(미니PC tools/intake-watcher) 전용 열쇠, 32자 이상.
#       없으면 /api/intake-worker/* 는 404 (AI 초안 없이 0단계처럼 동작). 감시 서비스의 열쇠 파일과 같은 값.
# 로컬 개발 값은 .dev.vars (.dev.vars.example 참고, git 제외).

# 편집진 올림함(intake/) 원본 1년 뒤 자동 삭제 — 하루 1번, 한국 03:00 (2026-11-27, intake.ts purgeExpiredIntakes)
# 로컬 확인: wrangler dev --test-scheduled 로 띄우고 curl "http://localhost:<API 포트>/__scheduled?cron=0+18+*+*+*"
[triggers]
crons = ["0 18 * * *"]
